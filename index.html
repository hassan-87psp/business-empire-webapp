<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahid's Business Empire — Dashboard</title>
<meta name="theme-color" content="#0B0E11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Business Empire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
// V11 deployment guard: clear older Business Empire PWA caches so mixed builds cannot survive an update.
if ('caches' in window) {
  caches.keys().then(keys => Promise.all(keys.filter(k => k.startsWith('business-empire-pwa-')).map(k => caches.delete(k)))).catch(()=>{});
}
</script>
<script defer src="app-config.js?v=11"></script>
<script defer src="auth-client.js?v=11"></script>
<script defer src="storage-adapter.js?v=11"></script>
<script defer src="app.js?v=11"></script>
<style>
:root{
  --bg:#0B0E11; --bg2:#12151A; --card:#181A20; --card2:#1E2128;
  --border:#262A33; --text:#EAECEF; --sub:#848E9C; --gold:#F0B90B;
  --green:#0ECB81; --red:#F6465D; --shadow: 0 8px 24px rgba(0,0,0,.35);
}
body.light-theme{
  --bg:#EFEAE0; --bg2:#F5F1E8; --card:#FFFDF8; --card2:#F3EEE2;
  --border:#DED5C0; --text:#2B2A26; --sub:#7A7261; --gold:#B8860B;
  --green:#0A9A5E; --red:#D6304A; --shadow: 0 6px 20px rgba(60,50,20,.10);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, #1a1d24 0%, transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, #171a1f 0%, transparent 55%),
    var(--bg);
  color:var(--text); font-family: 'Segoe UI', -apple-system, Roboto, Arial, sans-serif;
  min-height:100vh; padding-bottom:60px; transition:background .2s, color .2s;
}
body.light-theme{
  background:
    radial-gradient(1200px 600px at 10% -10%, #FBF8F0 0%, transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, #F7F2E6 0%, transparent 55%),
    var(--bg);
}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#2b2f38; border-radius:4px;}
body.light-theme::-webkit-scrollbar-thumb{background:#d8cfb8;}

/* ===== TOP BAR ===== */
.topbar{
  padding:16px 28px 14px; display:flex; flex-direction:column; gap:12px;
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;
  background:rgba(11,14,17,.92); backdrop-filter:blur(10px);
}
.topbar-row1{display:flex; align-items:center; justify-content:space-between;}
.topbar-row2{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.menu-btn{
  background:var(--card2); border:1px solid var(--border); color:var(--text); width:38px; height:38px;
  border-radius:10px; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:.15s;
}
.menu-btn:hover{border-color:var(--gold); color:var(--gold);}
.brand-mark{
  width:42px; height:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 2px 6px rgba(240,185,11,.25)); cursor:pointer;
}
.brand-mark:focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:10px;}
.brand-mark img{width:100%; height:100%; object-fit:contain;}
.brand-text{display:flex; flex-direction:column; justify-content:center; gap:1px;}
.brand-wordmark{
  font-size:19px; font-weight:800; letter-spacing:.2px; line-height:1.1;
  background:linear-gradient(135deg,var(--gold),#c9930a); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.brand-tagline{color:var(--sub); font-size:9.5px; letter-spacing:1px; text-transform:uppercase; font-weight:600;}
.brand h1{font-size:11px; font-weight:600; letter-spacing:.4px; color:var(--sub); text-transform:uppercase;}
.brand span{color:var(--sub); font-size:11px; display:block; margin-top:1px;}
.page-heading{padding:14px 28px 4px; max-width:1280px; margin:0 auto;}
.page-heading h2{font-size:19px; font-weight:800;}
.page-heading span{color:var(--sub); font-size:12.5px; display:block; margin-top:3px;}
.biz-count-badge{
  background:var(--card2); border:1px solid var(--border); color:var(--gold); font-size:12.5px; font-weight:800;
  padding:7px 15px; border-radius:20px; white-space:nowrap;
}
.backbtn{
  background:var(--card2); border:1px solid var(--border); color:var(--text);
  padding:7px 14px; border-radius:20px; cursor:pointer; font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:6px; transition:.15s;
}
.backbtn:hover{border-color:var(--gold); color:var(--gold);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.reminder-btn{
  position:relative; background:var(--card2); border:1px solid var(--border); color:var(--text);
  padding:7px 14px; border-radius:20px; cursor:pointer; font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:7px; transition:.15s;
}
.reminder-btn:hover{border-color:var(--gold); color:var(--gold);}
.reminder-badge{
  background:var(--red); color:#fff; font-size:10px; font-weight:800; min-width:18px; height:18px;
  border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px;
}
.reminder-badge.zero{background:#2b2f38; color:var(--sub);}

/* ===== CONTAINER ===== */
.wrap{max-width:1280px; margin:0 auto; padding:28px;}

/* ===== COMBINED SUMMARY ===== */
.summary-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
.sum-card{
  background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--border);
  border-radius:12px; padding:13px 15px; box-shadow:var(--shadow);
}
.sum-card .lbl{color:var(--sub); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px;}
.sum-card .val{font-size:17px; font-weight:800;}
.sum-card .sub-val{font-size:10.5px; color:var(--sub); margin-top:2px;}
.sum-card.income .val{color:var(--green);}
.sum-card.expense .val{color:var(--red);}
.sum-card.net .val{color:var(--gold);}
.sum-card.clickable{cursor:pointer; transition:.15s;}
.sum-card.clickable:hover{border-color:var(--gold); transform:translateY(-2px);}
.fx-note{font-size:11px; color:var(--sub);}

/* ===== BUSINESS GRID ===== */
.section-title{font-size:14px; color:var(--sub); text-transform:uppercase; letter-spacing:1px; margin:6px 0 14px 2px; font-weight:700;}
.biz-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px;}
.biz-card{
  background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px;
  cursor:pointer; position:relative; overflow:hidden; transition:.18s ease; box-shadow:var(--shadow);
}
.biz-card.dragging{opacity:.4;}
.biz-card.drag-over{border-color:var(--gold); transform:scale(1.02);}
.biz-num{
  position:absolute; top:12px; right:14px; width:26px; height:26px; border-radius:50%;
  background:var(--card2); border:1px solid var(--border); color:var(--sub); font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.drag-handle{position:absolute; top:14px; left:14px; color:var(--sub); font-size:14px; cursor:grab; opacity:.5;}
.drag-handle:hover{opacity:1;}
.sort-bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
.sort-note{font-size:12px; color:var(--sub);}
.biz-card:hover{transform:translateY(-3px); border-color:var(--accent);}
.biz-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--accent);
}
.biz-top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.biz-icon{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:22px; background:color-mix(in srgb, var(--accent) 20%, transparent); flex-shrink:0;
}
.biz-name{font-size:15px; font-weight:700;}
.biz-tag{font-size:11px; color:var(--sub); margin-top:2px;}
.biz-stats{display:flex; justify-content:space-between; border-top:1px solid var(--border); padding-top:12px; margin-top:4px;}
.biz-stat .l{font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.4px;}
.biz-stat .v{font-size:13px; font-weight:700; margin-top:3px;}
.biz-stat .v-sub{font-size:9.5px; color:var(--sub); font-weight:600; margin-top:1px;}
.biz-stat.net .v{color:var(--accent, var(--gold));}

/* ===== DETAIL VIEW ===== */
.detail-header{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
.detail-icon{width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px;}
.detail-title h2{font-size:22px; font-weight:800;}
.detail-title p{color:var(--sub); font-size:13px; margin-top:2px;}

.tabs{
  display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:22px; flex-wrap:nowrap;
  position:sticky; top:118px; z-index:40; background:var(--bg); padding-top:4px;
}
.tab{
  padding:11px 14px; cursor:pointer; color:var(--sub); font-weight:600; font-size:13.5px;
  border-bottom:2px solid transparent; transition:.15s; flex:1 1 0; text-align:center; white-space:nowrap;
}
.tab.active{color:var(--text); border-color:var(--accent);}
.tab:hover{color:var(--text);}
@media(max-width:480px){
  .tab{padding:9px 2px; font-size:11px;}
}

.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow:var(--shadow);}
.card h3{font-size:14px; margin-bottom:14px; color:var(--sub); text-transform:uppercase; letter-spacing:.5px;}

.stat-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px;}
.stat-box{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
.stat-box .l{font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.5px;}
.stat-box .val{font-size:16px; font-weight:800; margin-top:5px;}
.stat-box .sub-val{font-size:10.5px; color:var(--sub); margin-top:3px;}
.stat-box.income .val{color:var(--green);}
.stat-box.expense .val{color:var(--red);}
.stat-box.profit .val{color:var(--gold);}

/* ===== FORMS ===== */
.form-row{display:grid; grid-template-columns:1fr 1fr 1fr 1fr auto; gap:10px; margin-bottom:18px; align-items:end;}
.form-row.wide{grid-template-columns:1.2fr 1fr 1fr 1fr 1fr auto;}
.field label{font-size:11px; color:var(--sub); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px;}
.field input, .field select{
  width:100%; background:var(--card2); border:1px solid var(--border); color:var(--text);
  padding:9px 10px; border-radius:8px; font-size:13px; outline:none;
}
.field input:focus, .field select:focus{border-color:var(--accent, var(--gold));}
.btn{
  background:var(--accent, var(--gold)); color:#0B0E11; border:none; padding:10px 18px; border-radius:8px;
  font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; transition:.15s;
}
.btn:hover{filter:brightness(1.1);}
.btn-ghost{
  background:transparent; border:1px solid var(--border); color:var(--sub); padding:6px 10px;
  border-radius:7px; font-size:12px; cursor:pointer;
}
.btn-ghost:hover{border-color:var(--red); color:var(--red);}
.btn-add-cat{background:var(--card2); border:1px dashed var(--border); color:var(--sub); padding:9px 12px; border-radius:8px; font-size:12px; cursor:pointer;}

/* ===== TABLE ===== */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; color:var(--sub); font-size:11px; text-transform:uppercase; letter-spacing:.5px;
  padding:10px 12px; border-bottom:1px solid var(--border);
}
td{padding:11px 12px; border-bottom:1px solid #1c1f26;}
tr:hover td{background:rgba(255,255,255,.02);}
.chip{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; display:inline-block;}
.amt-pos{color:var(--green); font-weight:700;}
.amt-neg{color:var(--red); font-weight:700;}
.empty-state{text-align:center; padding:50px 20px; color:var(--sub);}
.empty-state .big{font-size:34px; margin-bottom:10px;}

/* balance sheet */
.bs-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.bs-col h4{font-size:13px; margin-bottom:12px; color:var(--text);}
.bs-item{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #1c1f26; font-size:13px;}
.bs-total{display:flex; justify-content:space-between; padding-top:12px; margin-top:6px; border-top:2px solid var(--border); font-weight:800; font-size:14.5px;}

.toast{
  position:fixed; bottom:24px; right:24px; background:var(--card2); border:1px solid var(--accent, var(--gold));
  color:var(--text); padding:12px 18px; border-radius:10px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow); z-index:200; opacity:0; transform:translateY(10px); transition:.25s;
}
.toast.show{opacity:1; transform:translateY(0);}

.loading{display:flex; align-items:center; justify-content:center; padding:80px; color:var(--sub); font-size:14px;}

/* ===== META (date/time stamps) ===== */
.meta-line{font-size:11px; color:var(--sub); margin-top:2px;}
.edited-tag{font-size:10px; color:var(--gold); margin-left:6px; cursor:pointer; text-decoration:underline dotted;}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:300; padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px;
  width:100%; max-width:520px; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow);
}
.modal-box h3{font-size:15px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
.modal-close{cursor:pointer; color:var(--sub); font-size:20px; line-height:1;}
.modal-close:hover{color:var(--red);}
.modal-field{margin-bottom:14px;}
.modal-field label{font-size:11px; color:var(--sub); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px;}
.modal-field input, .modal-field select{
  width:100%; background:var(--card2); border:1px solid var(--border); color:var(--text);
  padding:10px 11px; border-radius:8px; font-size:13px; outline:none;
}
.modal-actions{display:flex; gap:10px; margin-top:18px;}
.mini-label{font-size:10.5px; color:var(--sub); text-transform:uppercase; letter-spacing:.6px; font-weight:700; margin-bottom:10px;}
.history-item{padding:10px 0; border-bottom:1px solid #1c1f26; font-size:12.5px;}
.history-item .ts{color:var(--gold); font-weight:700; margin-bottom:4px;}
.history-item .chg{color:var(--sub);}
.history-item .chg b{color:var(--text); font-weight:600;}

/* ===== REMINDERS ===== */
.rem-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px;}
.rem-stat{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow);}
.rem-stat .l{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.5px;}
.rem-stat .v{font-size:22px; font-weight:800; margin-top:6px;}
.rem-stat.overdue .v{color:var(--red);}
.rem-stat.today .v{color:var(--gold);}
.rem-stat.upcoming .v{color:#3B82F6;}
.rem-toprow{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.day-pills{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.day-pill{
  width:34px; height:34px; border-radius:50%; background:var(--card2); border:1px solid var(--border);
  color:var(--sub); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  cursor:pointer; user-select:none;
}
.day-pill.sel{background:var(--gold); color:#0B0E11; border-color:var(--gold);}
.rem-item{
  background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
  margin-bottom:12px; display:flex; align-items:center; gap:16px; box-shadow:var(--shadow);
}
.rem-item.done{opacity:.5;}
.rem-time{
  min-width:74px; text-align:center; font-size:14px; font-weight:800; color:var(--gold);
  background:var(--card2); border-radius:10px; padding:8px 6px;
}
.rem-body{flex:1;}
.rem-title{font-size:14px; font-weight:700;}
.rem-sub{font-size:12px; color:var(--sub); margin-top:3px;}
.status-chip{padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;}
.status-chip.overdue{background:rgba(246,70,93,.15); color:var(--red);}
.status-chip.due{background:rgba(240,185,11,.15); color:var(--gold);}
.status-chip.later{background:rgba(59,130,246,.15); color:#3B82F6;}
.status-chip.done{background:rgba(14,203,129,.15); color:var(--green);}
.rem-section-title{font-size:13px; font-weight:700; color:var(--text); margin:22px 0 12px; display:flex; align-items:center; gap:8px;}
.email-note{font-size:11.5px; color:var(--sub); line-height:1.5; background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-top:8px;}

/* ===== FAB (quick add reminder) ===== */
.fab-reminder{
  position:fixed; bottom:26px; left:26px; z-index:150;
  background:linear-gradient(135deg,var(--gold),#c9930a); color:#0B0E11; border:none;
  padding:14px 20px; border-radius:30px; font-weight:800; font-size:13.5px; cursor:pointer;
  display:flex; align-items:center; gap:8px; box-shadow:0 8px 24px rgba(240,185,11,.35); transition:.15s;
}
.fab-reminder:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(240,185,11,.45);}
@media(max-width:600px){ .fab-reminder{left:16px; bottom:16px; padding:12px 16px; font-size:12.5px;} }

/* ===== GLOBAL LOG ===== */
.log-filters{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.log-filters select{background:var(--card2); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:8px; font-size:13px;}

/* ===== ACCESS GATE ===== */
.gate-wrap{max-width:440px; margin:60px auto; padding:0 20px;}
.gate-card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:32px 28px; box-shadow:var(--shadow); text-align:center;}
.gate-card h2{font-size:19px; margin-bottom:8px;}
.gate-card p{font-size:13px; color:var(--sub); margin-bottom:22px; line-height:1.6;}
.gate-choice{display:flex; flex-direction:column; gap:12px;}
.gate-btn{
  background:var(--card2); border:1px solid var(--border); color:var(--text); padding:16px 18px;
  border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; text-align:left; display:flex; align-items:center; gap:12px;
}
.gate-btn:hover{border-color:var(--gold);}
.gate-btn .ic{font-size:22px;}
.gate-back{font-size:12px; color:var(--sub); text-decoration:underline dotted; cursor:pointer; margin-top:16px; display:inline-block;}
.biz-check-list{display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; text-align:left; margin-bottom:6px;}
.biz-check-item{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13px;}
.biz-check-item input{width:auto;}
.session-bar{
  display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub);
  background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:7px 14px;
}
.session-bar b{color:var(--text);}
.pending-badge{background:var(--red); color:#fff; font-size:10px; font-weight:800; border-radius:9px; padding:2px 7px; margin-left:6px;}

/* ===== SIDEBAR ===== */
.sidebar-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:250; display:none;
}
.sidebar-overlay.show{display:block;}
.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:300px; max-width:85vw; background:var(--card);
  border-right:1px solid var(--border); z-index:260; transform:translateX(-105%); transition:transform .25s ease;
  overflow-y:auto; box-shadow:0 0 40px rgba(0,0,0,.4);
}
.sidebar.show{transform:translateX(0);}
.sidebar-header{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);}
.sidebar-header h3{font-size:15px; font-weight:800;}

/* Flat single-list menu, everything left-aligned */
.menu-list{padding:14px 12px 24px;}
.menu-avatar-row{display:flex; align-items:center; gap:12px; padding:8px 8px 18px;}
.menu-avatar{
  width:56px; height:56px; border-radius:50%; flex-shrink:0; cursor:pointer; position:relative;
  background:linear-gradient(135deg,var(--gold),#c9930a); display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:800; color:#0B0E11; overflow:hidden; border:2px solid var(--border);
}
.menu-avatar img{width:100%; height:100%; object-fit:cover;}
.menu-avatar .cam-badge{
  position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:50%; background:var(--card2);
  border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px;
}
.menu-name{font-size:14.5px; font-weight:800;}
.menu-sub{font-size:11.5px; color:var(--sub); margin-top:1px;}
.menu-item{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 8px; font-size:13.5px;
  font-weight:600; color:var(--text); background:transparent; border:none; cursor:pointer; border-radius:8px; transition:.15s;
}
.menu-item:hover{background:var(--card2);}
.menu-item .mi-icon{width:20px; text-align:center; font-size:15px; flex-shrink:0;}
.menu-item .mi-right{margin-left:auto; display:flex; align-items:center; gap:6px;}
.menu-item.accent{color:var(--gold);}
.menu-item.accent .mi-icon{color:var(--gold);}
.menu-toggle{
  width:38px; height:22px; border-radius:20px; background:var(--card2); border:1px solid var(--border); position:relative; transition:.2s; flex-shrink:0;
}
.menu-toggle.on{background:var(--gold); border-color:var(--gold);}
.menu-toggle .knob{
  position:absolute; top:1px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--card); transition:.2s;
}
.menu-toggle.on .knob{left:18px; background:#0B0E11;}
.sidebar-biz-list{display:flex; flex-direction:column; gap:6px; max-height:320px; overflow-y:auto; padding:6px 8px 4px 40px;}
.sidebar-biz-item{
  display:flex; align-items:center; justify-content:space-between; background:var(--card2); border:1px solid var(--border);
  border-radius:10px; padding:9px 11px; font-size:13px;
}
.sidebar-biz-item > span:first-child{cursor:pointer; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sidebar-biz-actions{display:flex; gap:4px; flex-shrink:0;}
.icon-btn{
  background:transparent; border:1px solid var(--border); color:var(--sub); width:26px; height:26px; border-radius:7px;
  cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover{border-color:var(--gold); color:var(--gold);}
.color-swatches{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.color-swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
.color-swatch.sel{border-color:var(--text);}
.sidebar-details{margin:0;}
.sidebar-details summary{
  cursor:pointer; font-size:13.5px; color:var(--gold); font-weight:700;
  list-style:none; display:flex; align-items:center; gap:12px; padding:12px 8px;
  border-radius:8px; transition:.15s;
}
.sidebar-details summary:hover{background:var(--card2);}
.sidebar-details summary::-webkit-details-marker{display:none;}
.sidebar-details summary .mi-icon{color:var(--gold);}
.sidebar-details summary::after{
  content:'▾'; font-size:18px; color:var(--gold); font-weight:800; line-height:1; transition:.2s; margin-left:auto;
}
.sidebar-details[open] summary::after{content:'▴'; color:var(--gold);}


/* ===== V8 PROFESSIONAL MOBILE NAV + MENU ICONS ===== */
.menu-item > svg,
.sidebar-details summary > svg{
  width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.menu-item.logout-item{margin-top:8px;padding-top:14px;border-top:1px solid var(--border);border-radius:0;color:var(--red);}
.menu-count{
  margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;background:rgba(240,185,11,.14);
  color:var(--gold);font-size:10px;font-weight:800;
}
.quick-action-grid{display:grid;grid-template-columns:1fr;gap:10px;}
.quick-action{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:15px;
  border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;
}
.quick-action:hover{border-color:var(--gold);}
.quick-action svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 22px;}
.quick-action.income svg{color:var(--green)} .quick-action.expense svg{color:var(--red)} .quick-action.reminder svg{color:var(--gold)}
.quick-action span{display:flex;flex-direction:column;gap:3px}.quick-action b{font-size:13px}.quick-action small{font-size:11px;color:var(--sub)}
.quick-biz-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;}
.quick-biz-btn{
  display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);border-radius:10px;cursor:pointer;text-align:left;font-weight:700;
}
.quick-biz-btn:hover{border-color:var(--gold)}
.quick-biz-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}

.mobile-bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:220;height:68px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 94%,transparent);
  border-top:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 -12px 28px rgba(0,0,0,.28);align-items:flex-start;justify-content:space-around;
}
.mobile-nav-item{
  position:relative;border:0;background:transparent;color:var(--sub);min-width:56px;height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  font-size:9.5px;font-weight:700;border-radius:12px;
}
.mobile-nav-item svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav-item.active{color:var(--gold)}
.mobile-nav-item.center-add{transform:translateY(-15px);gap:2px;color:var(--text)}
.mobile-nav-item.center-add .add-circle{
  width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--gold),#d89d00);color:#0b0e11;
  box-shadow:0 8px 22px rgba(240,185,11,.28);border:1px solid rgba(255,255,255,.12);
}
.mobile-nav-item.center-add .add-circle svg{width:24px;height:24px;stroke-width:2.2}
.mobile-nav-item.center-add span:last-child{font-size:9px;color:var(--sub);font-weight:800}
@media(min-width:761px){.mobile-bottom-nav{display:none!important}}
@media(max-width:760px){
  body{padding-bottom:88px}
  .fab-reminder{display:none!important}
  .toast{bottom:86px}
  .sidebar{padding-bottom:76px}
  .wrap{padding-bottom:18px}
}

@media(max-width:900px){
  .grid2{grid-template-columns:1fr;} .form-row, .form-row.wide{grid-template-columns:1fr 1fr;} .summary-row{grid-template-columns:1fr 1fr;}
}
</style>
</head>
